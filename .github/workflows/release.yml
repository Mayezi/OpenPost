name: OpenPost Tag Release (Win / macOS / Linux)

# 仅允许通过推送 v* Git Tag 触发自动打包与 GitHub Releases 发布
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  OPENPOST_OFFLINE_ONLY: '1'
  NPM_CONFIG_LEGACY_PEER_DEPS: 'true'

jobs:
  build-frontend:
    name: Build Frontend Assets (${{ github.ref_name }})
    runs-on: ubuntu-24.04
    outputs:
      rel_tag: ${{ steps.meta.outputs.rel_tag }}
      app_version: ${{ steps.meta.outputs.app_version }}
    steps:
      - name: Checkout Tag
        uses: actions/checkout@v7

      - name: Resolve Version Metadata from Tag
        id: meta
        shell: bash
        run: |
          REL_TAG="${GITHUB_REF_NAME}"
          APP_VERSION="${REL_TAG#v}"
          APP_VERSION="${APP_VERSION#V}"
          echo "rel_tag=${REL_TAG}" >> "$GITHUB_OUTPUT"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building OpenPost tag=${REL_TAG}, version=${APP_VERSION}, repo=${GITHUB_REPOSITORY}"

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Clean Lockfile & Install Dependencies
        run: |
          rm -f package-lock.json bun.lock
          npm install --no-package-lock --no-audit --no-fund

      - name: TypeScript Check & Build Frontend Dist
        env:
          VITE_APP_VERSION: ${{ steps.meta.outputs.app_version }}
          VITE_GITHUB_REPO: ${{ github.repository }}
        run: |
          npm run lint
          npm run build

      - name: Upload Compiled Frontend Assets (dist/)
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: dist/
          if-no-files-found: error

  build-rust-desktop:
    name: Build Native Installer ${{ matrix.label }}
    needs: build-frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_os: windows
            label: Windows x64 (Setup.exe Installer)
            artifact_name: OpenPost-Windows-x64-Installer
          - os: macos-latest
            target_os: macos
            label: macOS (.dmg Native Installer)
            artifact_name: OpenPost-macOS-Installer
          - os: ubuntu-24.04
            target_os: linux
            label: Linux amd64 (.deb Native Installer)
            artifact_name: OpenPost-Linux-amd64-Installer

    runs-on: ${{ matrix.os }}
    env:
      REL_TAG: ${{ needs.build-frontend.outputs.rel_tag }}
      APP_VERSION: ${{ needs.build-frontend.outputs.app_version }}
      OPENPOST_APP_VERSION: ${{ needs.build-frontend.outputs.app_version }}
      OPENPOST_GITHUB_REPO: ${{ github.repository }}
    steps:
      - name: Checkout Tag
        uses: actions/checkout@v7

      - name: Download Compiled Frontend Assets into dist/
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: dist/

      - name: Install Linux Native WebKitGTK & GTK3 Development Headers
        if: matrix.target_os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev pkg-config build-essential

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Cargo Crate Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-desktop

      - name: Compile Standalone Rust Native Desktop Binary (tao + wry WebView)
        run: cargo build --release --manifest-path rust-desktop/Cargo.toml

      - name: Build Windows Native Setup.exe Installer Wizard (NSIS)
        if: matrix.target_os == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "release-dist" | Out-Null

          $appVer = $env:APP_VERSION
          $icoPath = (Resolve-Path "public/icons/openpost_icon_pack/platform/windows/openpost.ico").Path
          $exePath = (Resolve-Path "rust-desktop/target/release/OpenPost.exe").Path
          $outSetup = Join-Path (Resolve-Path "release-dist").Path "OpenPost-Windows-x64-Setup.exe"

          $nsiContent = @"
          Unicode True
          !include "MUI2.nsh"

          Name "OpenPost"
          OutFile "$outSetup"
          InstallDir "`$LOCALAPPDATA\Programs\OpenPost"
          InstallDirRegKey HKCU "Software\OpenPost" "Install_Dir"
          RequestExecutionLevel user
          BrandingText "OpenPost v$appVer Native Rust Desktop Engine"

          !define MUI_ICON "$icoPath"
          !define MUI_UNICON "$icoPath"
          !define MUI_ABORTWARNING
          !define MUI_FINISHPAGE_RUN "`$INSTDIR\OpenPost.exe"
          !define MUI_FINISHPAGE_RUN_TEXT "立即启动 OpenPost"

          !insertmacro MUI_PAGE_WELCOME
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_PAGE_FINISH

          !insertmacro MUI_UNPAGE_CONFIRM
          !insertmacro MUI_UNPAGE_INSTFILES

          !insertmacro MUI_LANGUAGE "SimpChinese"

          Section "OpenPost 主程序 (必选)" SecMain
            SectionIn RO
            SetOutPath "`$INSTDIR"
            File "/oname=OpenPost.exe" "$exePath"
            File "/oname=openpost.ico" "$icoPath"

            WriteRegStr HKCU "Software\OpenPost" "Install_Dir" "`$INSTDIR"
            WriteUninstaller "`$INSTDIR\Uninstall.exe"

            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\OpenPost" "DisplayName" "OpenPost - Local-First API Studio"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\OpenPost" "DisplayVersion" "$appVer"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\OpenPost" "Publisher" "OpenPost Contributors"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\OpenPost" "DisplayIcon" "`$INSTDIR\OpenPost.exe"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\OpenPost" "InstallLocation" "`$INSTDIR"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\OpenPost" "UninstallString" '"`$INSTDIR\Uninstall.exe"'
            WriteRegDWORD HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\OpenPost" "NoModify" 1
            WriteRegDWORD HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\OpenPost" "NoRepair" 1

            CreateDirectory "`$SMPROGRAMS\OpenPost"
            CreateShortCut "`$SMPROGRAMS\OpenPost\OpenPost.lnk" "`$INSTDIR\OpenPost.exe" "" "`$INSTDIR\openpost.ico"
            CreateShortCut "`$SMPROGRAMS\OpenPost\卸载 OpenPost.lnk" "`$INSTDIR\Uninstall.exe" "" "`$INSTDIR\openpost.ico"
            CreateShortCut "`$DESKTOP\OpenPost.lnk" "`$INSTDIR\OpenPost.exe" "" "`$INSTDIR\openpost.ico"
          SectionEnd

          Section "Uninstall"
            Delete "`$INSTDIR\OpenPost.exe"
            Delete "`$INSTDIR\openpost.ico"
            Delete "`$INSTDIR\Uninstall.exe"
            Delete "`$SMPROGRAMS\OpenPost\OpenPost.lnk"
            Delete "`$SMPROGRAMS\OpenPost\卸载 OpenPost.lnk"
            Delete "`$DESKTOP\OpenPost.lnk"
            RMDir "`$SMPROGRAMS\OpenPost"
            RMDir "`$INSTDIR"
            DeleteRegKey HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\OpenPost"
            DeleteRegKey HKCU "Software\OpenPost"
          SectionEnd
          "@

          $nsiFile = Join-Path $PWD.Path "installer.nsi"
          [System.IO.File]::WriteAllText($nsiFile, $nsiContent, [System.Text.UTF8Encoding]::new($true))

          $makensisExe = $null
          if (Get-Command makensis -ErrorAction SilentlyContinue) {
            $makensisExe = (Get-Command makensis).Source
          } elseif (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe") {
            $makensisExe = "C:\Program Files (x86)\NSIS\makensis.exe"
          } else {
            choco install nsis -y
            $makensisExe = "C:\Program Files (x86)\NSIS\makensis.exe"
          }

          & $makensisExe $nsiFile
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $outSetup)) {
            throw "Failed to build Windows NSIS Setup Installer ($outSetup)"
          }

      - name: Build macOS Native .dmg Installer (No Zip)
        if: matrix.target_os == 'macos'
        shell: bash
        run: |
          mkdir -p release-dist
          APP_DIR="dmg-staging/OpenPost.app/Contents"
          mkdir -p "$APP_DIR/MacOS" "$APP_DIR/Resources"

          cp "rust-desktop/target/release/OpenPost" "$APP_DIR/MacOS/OpenPost"
          chmod +x "$APP_DIR/MacOS/OpenPost"

          iconutil -c icns "public/icons/openpost_icon_pack/platform/macos/openpost.iconset" -o "$APP_DIR/Resources/openpost.icns" || true

          cat > "$APP_DIR/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>OpenPost</string>
            <key>CFBundleIconFile</key>
            <string>openpost.icns</string>
            <key>CFBundleIdentifier</key>
            <string>dev.openpost.desktop</string>
            <key>CFBundleName</key>
            <string>OpenPost</string>
            <key>CFBundleDisplayName</key>
            <string>OpenPost</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${APP_VERSION}</string>
            <key>CFBundleVersion</key>
            <string>${APP_VERSION}</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF

          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "OpenPost" -srcfolder "dmg-staging" -ov -format UDZO "release-dist/OpenPost-macOS-Universal.dmg"

      - name: Build Linux Native .deb Installer (No Tar/Zip)
        if: matrix.target_os == 'linux'
        shell: bash
        run: |
          mkdir -p release-dist
          DEB_VER="${APP_VERSION//-/\~}"
          DEB_DIR="deb-staging/openpost_${DEB_VER}_amd64"
          mkdir -p "$DEB_DIR/DEBIAN"
          mkdir -p "$DEB_DIR/usr/bin"
          mkdir -p "$DEB_DIR/usr/share/applications"
          mkdir -p "$DEB_DIR/usr/share/icons/hicolor/256x256/apps"

          cp "rust-desktop/target/release/OpenPost" "$DEB_DIR/usr/bin/openpost"
          chmod 0755 "$DEB_DIR/usr/bin/openpost"
          cp "public/icons/openpost_icon_pack/png/transparent/openpost-256-transparent.png" "$DEB_DIR/usr/share/icons/hicolor/256x256/apps/openpost.png"

          cat > "$DEB_DIR/DEBIAN/control" <<EOF
          Package: openpost
          Version: ${DEB_VER}
          Section: devel
          Priority: optional
          Architecture: amd64
          Depends: libwebkit2gtk-4.1-0, libgtk-3-0
          Maintainer: OpenPost Contributors
          Description: OpenPost 100% Local-First API Debugging Studio (Zero Login, Zero Telemetry)
          EOF

          cat > "$DEB_DIR/usr/share/applications/openpost.desktop" <<EOF
          [Desktop Entry]
          Name=OpenPost
          Comment=100% Local-First API Debugging Studio
          Exec=/usr/bin/openpost
          Icon=openpost
          Terminal=false
          Type=Application
          Categories=Development;WebDevelopment;
          EOF

          dpkg-deb --build "$DEB_DIR" "release-dist/OpenPost-Linux-amd64.deb"

      - name: Upload Raw Installer to Workflow Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: release-dist/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release (${{ needs.build-frontend.outputs.rel_tag }})
    needs:
      - build-frontend
      - build-rust-desktop
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REL_TAG: ${{ needs.build-frontend.outputs.rel_tag }}
      APP_VERSION: ${{ needs.build-frontend.outputs.app_version }}
    steps:
      - name: Checkout Repository (with History for Fallback Notes)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download All Platform Installers
        uses: actions/download-artifact@v8
        with:
          pattern: OpenPost-*-Installer
          path: release-assets
          merge-multiple: true

      - name: Prepare Standardized 3-Theme Release Notes (新功能 / 改进 / 问题修复)
        shell: bash
        run: |
          CHANGELOG_FILE="changelogs/${REL_TAG}.md"
          OUT_NOTES="release-notes.md"

          if [ -f "$CHANGELOG_FILE" ]; then
            echo "Using dedicated changelog file: $CHANGELOG_FILE"
            node -e '
              const fs = require("fs");
              const raw = fs.readFileSync(process.argv[1], "utf8");
              const sections = { features: [], improvements: [], fixes: [] };
              let current = null;
              for (const line of raw.split(/\r?\n/)) {
                const trimmed = line.trim();
                const hMatch = trimmed.match(/^#{1,4}\s+(.+)$/);
                if (hMatch) {
                  const title = hMatch[1].toLowerCase();
                  if (/新功能|新增|feature|added/.test(title)) current = "features";
                  else if (/改进|优化|improv|chang|enhanc|perf/.test(title)) current = "improvements";
                  else if (/问题修复|修复|bug|fix/.test(title)) current = "fixes";
                  else current = null;
                  continue;
                }
                const itemMatch = trimmed.match(/^[-*•]\s+(.+)$/);
                if (itemMatch && current) {
                  sections[current].push("- " + itemMatch[1].trim());
                }
              }
              const blocks = [];
              if (sections.features.length) blocks.push("## 新功能\n" + sections.features.join("\n"));
              if (sections.improvements.length) blocks.push("## 改进\n" + sections.improvements.join("\n"));
              if (sections.fixes.length) blocks.push("## 问题修复\n" + sections.fixes.join("\n"));
              const out = blocks.length ? blocks.join("\n\n") + "\n" : raw;
              fs.writeFileSync(process.argv[2], out, "utf8");
            ' "$CHANGELOG_FILE" "$OUT_NOTES"
          else
            echo "No changelogs/${REL_TAG}.md found; generating standardized 3-theme notes from commits..."
            PREV_TAG=$(git describe --tags --abbrev=0 "${REL_TAG}^" 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              COMMITS=$(git log --pretty=format:"%s" "${PREV_TAG}..${REL_TAG}")
            else
              COMMITS=$(git log -n 20 --pretty=format:"%s" "${REL_TAG}")
            fi
            node -e '
              const fs = require("fs");
              const lines = (process.argv[1] || "").split(/\r?\n/).map(s => s.trim()).filter(Boolean);
              const sections = { features: [], improvements: [], fixes: [] };
              for (const msg of lines) {
                if (/^merge\b/i.test(msg)) continue;
                if (/^(feat|feature)(\(.+\))?:/i.test(msg)) {
                  sections.features.push("- " + msg.replace(/^[^:]+:\s*/, ""));
                } else if (/^(fix|bugfix|hotfix)(\(.+\))?:/i.test(msg)) {
                  sections.fixes.push("- " + msg.replace(/^[^:]+:\s*/, ""));
                } else {
                  sections.improvements.push("- " + msg.replace(/^[^:]+:\s*/, ""));
                }
              }
              const blocks = [];
              blocks.push("## 新功能\n" + (sections.features.length ? sections.features.join("\n") : "- 本版本暂无新增功能"));
              blocks.push("## 改进\n" + (sections.improvements.length ? sections.improvements.join("\n") : "- 常规构建与稳定性优化"));
              blocks.push("## 问题修复\n" + (sections.fixes.length ? sections.fixes.join("\n") : "- 常规细节修复"));
              fs.writeFileSync(process.argv[2], blocks.join("\n\n") + "\n", "utf8");
            ' "$COMMITS" "$OUT_NOTES"
          fi

          cat "$OUT_NOTES"

      - name: Create or Update GitHub Release & Upload Native Installers
        shell: bash
        run: |
          PRERELEASE_FLAG=""
          if [[ "$REL_TAG" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          if gh release view "$REL_TAG" >/dev/null 2>&1; then
            gh release edit "$REL_TAG" --title "OpenPost $REL_TAG" --notes-file release-notes.md
          else
            gh release create "$REL_TAG" $PRERELEASE_FLAG --title "OpenPost $REL_TAG" --notes-file release-notes.md
          fi

          gh release upload "$REL_TAG" release-assets/* --clobber

          echo "### OpenPost ${REL_TAG} 发布完成" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### 原生安装包直链下载" >> "$GITHUB_STEP_SUMMARY"
          for f in release-assets/*; do
            fname=$(basename "$f")
            echo "- [**下载 \`$fname\`**](https://github.com/${{ github.repository }}/releases/download/${REL_TAG}/${fname})" >> "$GITHUB_STEP_SUMMARY"
          done
