name: openPost Multi-Platform Desktop Release (Win / macOS / Linux)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version tag (e.g. v2.0.0)'
        required: false
        default: 'v2.0.0'

permissions:
  contents: write

env:
  OPENPOST_OFFLINE_ONLY: '1'
  TAURI_TELEMETRY_DISABLED: '1'
  NODE_VERSION: '22.x'

jobs:
  verify-and-lint:
    name: Typecheck & Production Build (Node ${{ env.NODE_VERSION }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript Typecheck (lint)
        run: npm run lint

      - name: Build Production Frontend Bundle
        run: npm run build

  build-desktop-matrix:
    name: Package ${{ matrix.label }}
    needs: verify-and-lint
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_os: windows
            target_arch: x64
            label: Windows (x64 Desktop Package)
            artifact_name: openPost-Windows-x64
          - os: macos-latest
            target_os: macos
            target_arch: universal
            label: macOS (Apple Silicon & Intel Universal)
            artifact_name: openPost-macOS-Universal
          - os: ubuntu-latest
            target_os: linux
            target_arch: x64
            label: Linux (x64 Desktop Package)
            artifact_name: openPost-Linux-x64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Build Frontend Production Assets
        run: npm run build

      - name: Package Standalone Desktop Bundle (${{ matrix.target_os }})
        env:
          TARGET_OS: ${{ matrix.target_os }}
          TARGET_ARCH: ${{ matrix.target_arch }}
        run: npm run build:desktop

      - name: Create Release Archive (Windows .zip)
        if: matrix.target_os == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "release-dist/*" -DestinationPath "release-dist/${{ matrix.artifact_name }}.zip" -Force

      - name: Create Release Archive (macOS & Linux .tar.gz)
        if: matrix.target_os != 'windows'
        shell: bash
        run: |
          tar -czf "release-dist/${{ matrix.artifact_name }}.tar.gz" -C release-dist .

      - name: Upload Desktop Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            release-dist/*.zip
            release-dist/*.tar.gz
          if-no-files-found: error

      - name: Publish to GitHub Releases (on Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: "openPost ${{ github.ref_name }}"
          body: "100% Local-First, Zero-Login, Zero-Backdoor API Client for Windows, macOS, and Linux."
          draft: false
          prerelease: false
          files: |
            release-dist/*.zip
            release-dist/*.tar.gz
