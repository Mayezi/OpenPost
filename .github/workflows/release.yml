name: openPost Multi-Platform Rust Desktop Release (Win / macOS / Linux)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  OPENPOST_OFFLINE_ONLY: '1'
  NPM_CONFIG_LEGACY_PEER_DEPS: 'true'

jobs:
  verify-and-lint:
    name: Typecheck & Frontend Build (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: TypeScript Typecheck (lint)
        run: npm run lint

      - name: Build Production Frontend Bundle
        run: npm run build

  build-rust-desktop-matrix:
    name: Build Rust Native ${{ matrix.label }}
    needs: verify-and-lint
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_os: windows
            bin_name: openPost.exe
            label: Windows x64 (openPost.exe)
            artifact_name: openPost-Windows-x64
          - os: macos-latest
            target_os: macos
            bin_name: openPost
            label: macOS Apple Silicon & Intel (openPost)
            artifact_name: openPost-macOS
          - os: ubuntu-latest
            target_os: linux
            bin_name: openPost
            label: Linux x64 (openPost)
            artifact_name: openPost-Linux-x64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Frontend Assets (Embedded into Rust Binary)
        run: npm run build

      - name: Compile Standalone Rust Native Binary (${{ matrix.bin_name }})
        run: cargo build --release --manifest-path rust-desktop/Cargo.toml

      - name: Package Windows Release Archive (.zip)
        if: matrix.target_os == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release-dist" | Out-Null
          Copy-Item "rust-desktop/target/release/openPost.exe" -Destination "release-dist/openPost.exe"
          Copy-Item "README.md" -Destination "release-dist/README.md"
          Compress-Archive -Path "release-dist/openPost.exe", "release-dist/README.md" -DestinationPath "release-dist/${{ matrix.artifact_name }}.zip" -Force

      - name: Package macOS & Linux Release Archive (.tar.gz)
        if: matrix.target_os != 'windows'
        shell: bash
        run: |
          mkdir -p release-dist
          cp "rust-desktop/target/release/openPost" "release-dist/openPost"
          chmod +x "release-dist/openPost"
          cp "README.md" "release-dist/README.md"
          tar -czf "release-dist/${{ matrix.artifact_name }}.tar.gz" -C release-dist openPost README.md

      - name: Upload Native Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            release-dist/*.zip
            release-dist/*.tar.gz
          if-no-files-found: error

      - name: Publish to GitHub Releases (on Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: "openPost ${{ github.ref_name }}"
          body: "100% Local-First, Zero-Login, Zero-Backdoor Rust Native API Client for Windows, macOS, and Linux."
          draft: false
          prerelease: false
          files: |
            release-dist/*.zip
            release-dist/*.tar.gz
