[package]
name = "openPost"
version = "2.0.2"
edition = "2021"
description = "openPost 100% Local-First Native Rust Desktop Core Engine (tao + wry + ureq + serde)"
license = "Apache-2.0"

[[bin]]
name = "openPost"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[dependencies]
tao = "=0.32.8"
wry = "=0.50.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = "2.10"
